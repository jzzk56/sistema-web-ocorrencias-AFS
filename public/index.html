<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AFS · Sistema de Ocorrências</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <rect width="28" height="28" rx="8" fill="currentColor" opacity=".15"/>
          <path d="M7 10h14M7 14h9M7 18h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="brand-name">AFS</span>
        <span class="brand-sub">Ocorrências</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-label">Menu</span>
      <a class="nav-item active" data-page="dashboard" href="#dashboard">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" fill="currentColor"/><rect x="11" y="2" width="7" height="7" rx="1.5" fill="currentColor" opacity=".5"/><rect x="2" y="11" width="7" height="7" rx="1.5" fill="currentColor" opacity=".5"/><rect x="11" y="11" width="7" height="7" rx="1.5" fill="currentColor"/></svg>
        Dashboard
      </a>
      <a class="nav-item" data-page="nova" href="#nova">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v8M6 10h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Nova Ocorrência
      </a>
      <a class="nav-item" data-page="ocorrencias" href="#ocorrencias">
        <svg class="nav-icon" viewBox="0 0 20 20" fill="none"><path d="M4 5h12M4 10h12M4 15h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Ocorrências
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="footer-badge">1º Campeonato de Programação</span>
    </div>
  </aside>

  <!-- ── Overlay (mobile) ─────────────────────────────────────────────────── -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ── Main ─────────────────────────────────────────────────────────────── -->
  <main class="main" id="main">
    <!-- Top bar -->
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menu">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="topbarCta">
          <svg viewBox="0 0 16 16" fill="none"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Nova Ocorrência
        </button>
      </div>
    </header>

    <!-- Page content -->
    <div class="page" id="page"></div>
  </main>

  <!-- ── Modal ─────────────────────────────────────────────────────────────── -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 class="modal-title" id="modalTitle">Detalhes</h3>
        <button class="modal-close" id="modalClose" aria-label="Fechar">
          <svg viewBox="0 0 16 16" fill="none"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- ── Toast container ───────────────────────────────────────────────────── -->
  <div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

  <!-- ── Confirm dialog ────────────────────────────────────────────────────── -->
  <div class="confirm-backdrop" id="confirmBackdrop">
    <div class="confirm-box">
      <p class="confirm-msg" id="confirmMsg">Tem certeza?</p>
      <div class="confirm-actions">
        <button class="btn btn-ghost" id="confirmNo">Cancelar</button>
        <button class="btn btn-danger" id="confirmYes">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
